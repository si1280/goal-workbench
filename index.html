/* ===== Toast ===== */
.toast-container {

  right: 16px;
  z-index: 500;
  display: flex;
  flex-direction: column;

  pointer-events: none;
}
.toast {

  padding: 10px 16px;
  border-radius: 12px;
  font-size: 13px;
  box-shadow: var(--shadow-lg);

  pointer-events: auto;
}
.toast.removing { animation: toastSlideOut 0.3s ease forwards; }
.toast-undo {

  padding: 4px 8px;
  margin-left: 12px;
}

  to { transform: translateY(0); opacity: 1; }
}
@keyframes toastSlideOut {
  from { transform: translateY(0); opacity: 1; }

}

function $(s) { return document.querySelector(s); }
function $$(s) { return document.querySelectorAll(s); }
function uid() { return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2,6); }
function clone(obj) { return JSON.parse(JSON.stringify(obj)); }

function formatDate(d) {
  var days = ['周日','周一','周二','周三','周四','周五','周六'];
  return (d.getMonth()+1)+'月'+d.getDate()+'日 '+days[d.getDay()];

function projectProgress(p) {
  if(!p.steps||p.steps.length===0) return 0;
  var done=p.steps.filter(function(s){return s.status==='done';}).length;
  return Math.round(done/p.steps.length*100);
}
function hasBlocker(p) {
  return p.steps.some(function(s){return s.status==='active'&&s.blocker;});
}
function getActiveBlocker(p) {
  return p.steps.find(function(s){return s.status==='active'&&s.blocker;});
}
function timeAgo(iso) {
  var d=new Date(iso); var now=new Date('2026-09-03T12:00:00');
  var diff=(now-d)/1000;
  if(diff<60) return '刚刚';
  if(diff<3600) return Math.floor(diff/60)+'分钟前';
  if(diff<86400) return Math.floor(diff/3600)+'小时前';
  return Math.floor(diff/86400)+'天前';
}

/* ===== Data Layer ===== */

    if(s) { var p=JSON.parse(s); if(p&&p.projects&&p.tasks&&p.gamification) return p; }
  } catch(e) { console.error('Load error:',e); }
  return clone(DEFAULT_DATA);
}
function saveData() {

    return false;
  }
  if(!stored) localStorage.setItem('gw_build_id',BUILD_ID);
  return true;

    case 'calendar': renderCalendar(c); break;

    case 'ai-chat': renderAIChat(c); break;

  var activeRoute=state.route;
  if(state.route==='project-detail') activeRoute='projects';
  if(state.route==='ai-chat') activeRoute=state.prevRoute==='inspirations'?'inspirations':'today';
  if(state.route==='achievement') activeRoute='dashboard';
  var html=tabs.map(function(t){
    return '<button class="nav-item '+(activeRoute===t.route?'active':'')+'" data-route="'+t.route+'">'+
      '<span class="nav-icon">'+t.icon+'</span><span>'+t.label+'</span></button>';
  }).join('');
  nav.innerHTML=html;
  nav.querySelectorAll('.nav-item').forEach(function(btn){
    btn.addEventListener('click',function(){ navigate(btn.dataset.route); });
  });

/* ===== Drag & Drop ===== */
function setupDragDrop(c) {
  var dragState={active:false,taskId:null,element:null,currentCell:null,startX:0,startY:0};
  c.querySelectorAll('.pool-item').forEach(function(item){
    item.addEventListener('touchstart',function(e){
      dragState.taskId=item.dataset.poolTask;
      dragState.startX=e.touches[0].clientX;
      dragState.startY=e.touches[0].clientY;
      dragState.active=false;
    },{passive:true});
    item.addEventListener('touchmove',function(e){
      if(!dragState.taskId) return;
      var touch=e.touches[0];
      var dx=touch.clientX-dragState.startX;
      var dy=touch.clientY-dragState.startY;
      if(!dragState.active&&(Math.abs(dx)>10||Math.abs(dy)>10)) {
        dragState.active=true;
        dragState.element=item.cloneNode(true);
        dragState.element.className+=' dragging-clone';
        dragState.element.style.width=item.offsetWidth+'px';
        dragState.element.style.left=(touch.clientX-40)+'px';
        dragState.element.style.top=(touch.clientY-30)+'px';
        document.body.appendChild(dragState.element);
        item.style.opacity='0.3';
        e.preventDefault();
      }
      if(dragState.active) {
        e.preventDefault();
        dragState.element.style.left=(touch.clientX-40)+'px';
        dragState.element.style.top=(touch.clientY-30)+'px';
        dragState.element.style.display='none';
        var elem=document.elementFromPoint(touch.clientX,touch.clientY);
        dragState.element.style.display='';
        c.querySelectorAll('.cal-cell.drag-over').forEach(function(el){el.classList.remove('drag-over');});
        if(elem) {
          var cell=elem.closest('.cal-cell');
          if(cell&&!cell.classList.contains('empty')) {
            cell.classList.add('drag-over');
            dragState.currentCell=cell;
          } else { dragState.currentCell=null; }
        }
      }
    },{passive:false});
    item.addEventListener('touchend',function(e){
      if(dragState.active&&dragState.currentCell) {
        var date=dragState.currentCell.dataset.date;
        assignTaskToDate(dragState.taskId,date);
      }
      if(dragState.element) { dragState.element.remove(); }
      c.querySelectorAll('.cal-cell.drag-over').forEach(function(el){el.classList.remove('drag-over');});
      c.querySelectorAll('.pool-item').forEach(function(i){i.style.opacity='';});
      dragState={active:false,taskId:null,element:null,currentCell:null,startX:0,startY:0};
    });
  });
}

/* ===== Event Handlers ===== */
function toggleTask(taskId) {
  var t=getTask(taskId); if(!t) return;
  var wasCompleted=t.completed;
  var xpDelta=wasCompleted?-t.xp:t.xp;
  t.completed=!wasCompleted;
  state.data.gamification.xp=Math.max(0,state.data.gamification.xp+xpDelta);
  if(t.completed) {
    showToast('+ '+xpDelta+' XP',function(){
      t.completed=false;
      state.data.gamification.xp=Math.max(0,state.data.gamification.xp-xpDelta);
      saveData(); render();
    });
  }
  // Check if all today's tasks done
  var todayTasks=state.data.tasks.filter(function(x){return x.date===todayStr();});
  if(todayTasks.length>0&&todayTasks.every(function(x){return x.completed;})) {
    state.data.gamification.xp+=50;
    saveData(); render();
    showCelebration(50,state.data.gamification.streak+1);
  } else {
    saveData(); render();
  }
}

function toggleStep(pid, sid) {
  var p=getProject(pid); if(!p) return;
  var s=p.steps.find(function(x){return x.id===sid;}); if(!s) return;
  if(s.status==='done') {
    s.status='todo';
    var task=state.data.tasks.find(function(t){return t.stepId===sid&&t.projectId===pid;});
    if(task) task.completed=false;
  } else {
    s.status='done';
    s.blocker=null;
  }
  saveData(); render();
}

function deleteProject(pid) {
  var p=getProject(pid); if(!p) return;
  var idx=state.data.projects.indexOf(p);
  var backup=clone(p);
  state.data.projects.splice(idx,1);
  state.data.tasks=state.data.tasks.filter(function(t){return t.projectId!==pid;});
  saveData(); render();
  showToast('已删除「'+p.name+'」',function(){
    state.data.projects.splice(idx,0,backup);
    saveData(); render();
  });
}

function assignTaskToDate(taskId, date) {
  var t=getTask(taskId); if(!t) return;
  var oldDate=t.date;
  t.date=date;
  saveData(); render();
  var dateLabel=date.replace(/2026-0?/,'').replace('-','月')+'日';
  showToast('已分配到 '+dateLabel,function(){
    t.date=oldDate; saveData(); render();
  });
}

function handleInspirationInput(text) {
  var aiKeywords=['归档','分析','安排','计划','复盘','卡','帮我','ai'];
  var isAI=aiKeywords.some(function(k){return text.toLowerCase().indexOf(k)>=0;});
  if(isAI) {
    navigate('ai-chat',{prefill:text});
  } else {
    var insp={id:uid(),content:text,type:'idea',projectId:null,createdAt:new Date().toISOString()};

    saveData(); render();
    showToast('灵感已记录',function(){

    });

/* ===== Progress Reset & XP Settings ===== */
function resetProgress() {
  var d=state.data;
  d.tasks.forEach(function(t){ t.completed=false; });

/* ===== AI Simulation ===== */
function handleAIInput(input) {
  var d=state.data;
  addChatMessage('user',input);
  var msg=input.toLowerCase();

  // Show typing
  showTyping();

  setTimeout(function(){
    removeTyping();

    // Pattern: archive inspiration
    if(msg.indexOf('归档')>=0&&msg.indexOf('灵感')>=0) {
      var unfiled=d.inspirations.filter(function(i){return !i.projectId;});
      if(unfiled.length===0) {
        addChatMessage('ai','目前没有未归档的灵感。你可以先在灵感池记录新灵感。');
        return;
      }
      var targetProj=null;
      d.projects.forEach(function(p){
        if(msg.indexOf(p.name)>=0||msg.indexOf(p.name.substring(0,2))>=0) targetProj=p;
      });
      if(!targetProj) targetProj=d.projects[0];
      var insp=unfiled[0];
      var preview=insp.content.length>20?insp.content.substring(0,20)+'…':insp.content;
      addConfirmMessage('将灵感「'+preview+'」归档到「'+targetProj.name+'」项目？',function(){
        var oldPid=insp.projectId;
        insp.projectId=targetProj.id;
        saveData();
        addChatMessage('ai','已归档到「'+targetProj.name+'」项目 ✅\n\n这条灵感很适合作为'+targetProj.name+'的素材。需要我帮你展开成具体任务吗？');
        showToast('灵感已归档',function(){ insp.projectId=oldPid; saveData(); renderAIChat($('#page-container')); });
      });
      return;
    }

    // Pattern: analyze blockers
    if(msg.indexOf('卡')>=0||msg.indexOf('分析')>=0||msg.indexOf('复盘')>=0) {
      var blocked=state.data.projects.filter(hasBlocker);
      var review='📊 复盘报告\n\n';
      var todayTasks=state.data.tasks.filter(function(t){return t.date===todayStr();});
      var completed=todayTasks.filter(function(t){return t.completed;}).length;
      review+='✅ 今日完成 '+completed+'/'+todayTasks.length+' 项任务\n';
      if(todayTasks.length-completed>0) {
        review+='⬜ 未完成 '+(todayTasks.length-completed)+' 项：\n';
        todayTasks.filter(function(t){return !t.completed;}).forEach(function(t){
          review+='   · '+(t.time?t.time+' ':'')+t.title+'\n';
        });
      }
      if(blocked.length>0) {
        review+='\n⚠ 卡点项目 '+blocked.length+' 个：\n';
        blocked.forEach(function(p){
          var ab=getActiveBlocker(p);
          review+='   · '+p.name+'：'+(ab?ab.blocker:'')+'\n';
        });
        review+='\n💡 优化建议：\n';
        review+='   · 优先处理"'+blocked[0].name+'"的卡点\n';
        review+='   · 考虑将大任务拆解为更小的可执行步骤\n';
        review+='   · 利用 AI 辅助分析人员能力画像';
      } else {
        review+='\n✨ 所有项目进展顺利，无卡点！';
      }
      review+='\n\n明日建议：\n   · 继续保持运动和英语学习习惯\n   · 推进'+(blocked.length>0?blocked[0].name:'自媒体运营')+'的关键步骤';
      addChatMessage('ai',review);
      return;
    }

    // Pattern: plan tasks
    if(msg.indexOf('安排')>=0||msg.indexOf('计划')>=0||msg.indexOf('明天')>=0) {
      var pool=state.data.tasks.filter(function(t){return !t.date&&!t.completed;});
      var plan='📅 明日计划建议\n\n基于任务池中 '+pool.length+' 个待排期任务：\n';
      pool.slice(0,3).forEach(function(t,i){
        var p=getProject(t.projectId);
        plan+='   '+(i+1)+'. '+t.title+'（'+(p?p.name:'')+'）\n';
      });
      plan+='\n建议安排：\n   · 早晨：运动 + 英语对话（循环型任务）\n   · 午休：选题构思或素材搜集\n   · 晚间：项目卡点推进 + 复盘';
      addChatMessage('ai',plan);
      return;
    }

    // Default
    addChatMessage('ai','我理解了你的需求。你可以试试以下指令：\n\n• 「把灵感归档到自媒体项目」\n• 「新项目卡在哪了？」\n• 「帮我安排明天的计划」\n• 「今日复盘」\n\n或者点击 📎 上传资料，我来帮你提取要点。');
  },1200);
}

/* ===== Toast / Undo ===== */
function showToast(message,undoFn) {
  var container=$('#toast-container');
  var toast=document.createElement('div');
  toast.className='toast';
  toast.innerHTML='<span>'+escapeHtml(message)+'</span>'+(undoFn?'<span class="toast-undo" data-undo="1">撤销</span>':'');
  container.appendChild(toast);
  var timer;
  if(undoFn) {
    toast.querySelector('[data-undo]').addEventListener('click',function(){
      clearTimeout(timer);
      toast.classList.add('removing');
      setTimeout(function(){toast.remove();},300);
      undoFn();
    });
  }
  timer=setTimeout(function(){
    toast.classList.add('removing');
    setTimeout(function(){toast.remove();},300);
  },3000);
}

/* ===== Modal ===== */
function showModal(html) {
  var overlay=$('#modal-overlay');
  overlay.innerHTML='<div class="modal-card">'+html+'</div>';
  overlay.classList.remove('hidden');
  overlay.onclick=function(e){
    if(e.target===overlay) closeModal();
  };
}
function closeModal() {
  var overlay=$('#modal-overlay');
  overlay.classList.add('hidden');
  overlay.innerHTML='';
}
window.closeModal=closeModal;

  var inp=$('#prompt-input');
  inp.focus();

function showCelebration(xp,streak) {
  var overlay=$('#celebration-overlay');
  overlay.className='celebration-overlay';
  overlay.innerHTML='<div class="celebration-card">'+
    '<div class="emoji">🎉</div>'+
    '<div class="title">今日全部完成！</div>'+
    '<div class="desc">+'+xp+' XP · 连续 '+streak+' 天 🔥</div></div>';
  var colors=['#B8745A','#5B9A6F','#5B8DB8','#E8A547','#8B6BA8','#D96B5E'];
  for(var i=0;i<24;i++) {
    var p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.bottom='0px';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];

    overlay.className='celebration-overlay hidden';
  });
  setTimeout(function(){
    overlay.className='celebration-overlay hidden';
  },4000);
}

/* ===== Swipe Delete ===== */
function setupSwipeDelete(element,onDelete) {
  var startX=0,startY=0,moved=false,horizontal=false,currentX=0;
  function ts(e){
    var t=e.touches[0];
    startX=t.clientX; startY=t.clientY;
    moved=false; horizontal=false; currentX=0;
    element.style.transition='none';
  }
  function tm(e){
    var t=e.touches[0];
    var dx=t.clientX-startX, dy=t.clientY-startY;
    if(!moved) {
      if(Math.abs(dx)>10||Math.abs(dy)>10) {
        moved=true;
        horizontal=Math.abs(dx)>Math.abs(dy);
      }
    }
    if(horizontal) {
      e.preventDefault(); e.stopPropagation();
      currentX=Math.min(0,Math.max(-120,dx));
      element.style.transform='translateX('+currentX+'px)';
      var bg=element.parentElement.querySelector('.swipe-delete-bg');
      if(bg) bg.style.opacity=Math.min(1,-currentX/80);
    }
  }
  function te(e){
    element.style.transition='transform 0.3s ease';
    if(horizontal&&currentX<-80) {
      element.style.transform='translateX(-100%)';
      setTimeout(onDelete,300);
    } else {
      element.style.transform='translateX(0)';
      var bg=element.parentElement.querySelector('.swipe-delete-bg');
      if(bg) bg.style.opacity='0';
    }
    moved=false; horizontal=false; currentX=0;
  }
  element.addEventListener('touchstart',ts,{passive:true});
  element.addEventListener('touchmove',tm,{passive:false});
  element.addEventListener('touchend',te,{passive:true});
}

/* ===== Form Modal ===== */
var PROJECT_COLORS=['#5B9A6F','#B8745A','#8B6BA8','#5B8DB8','#4A9B96','#E8A547','#D96B5E','#C97B9B'];
var PROJECT_ICONS=['🌱','📋','🎬','📚','🏠','🤝','💡','🎯','🎨','🏃','✈️','💻','📝','🔥','⭐','🚀'];
function showFormModal(title,fields,onConfirm,options) {
  var html='<div class="form-group" data-fg="1">';
  fields.forEach(function(f){
    html+='<div class="form-group"><label class="form-label">'+escapeHtml(f.label)+'</label>';
    if(f.type==='text')
      html+='<input type="text" class="form-input" id="field-'+f.name+'" value="'+escapeHtml(f.value||'')+'" placeholder="'+escapeHtml(f.placeholder||'')+'" />';
    else if(f.type==='date')
      html+='<input type="date" class="form-input" id="field-'+f.name+'" value="'+escapeHtml(f.value||'')+'" />';
    else if(f.type==='time')
      html+='<input type="time" class="form-input" id="field-'+f.name+'" value="'+escapeHtml(f.value||'')+'" />';
    else if(f.type==='textarea')
      html+='<textarea class="form-textarea" id="field-'+f.name+'" placeholder="'+escapeHtml(f.placeholder||'')+'">'+escapeHtml(f.value||'')+'</textarea>';
    else if(f.type==='select') {
      html+='<select class="form-select" id="field-'+f.name+'">';
      f.options.forEach(function(o){
        html+='<option value="'+o.value+'" '+(String(o.value)===String(f.value)?'selected':'')+'>'+escapeHtml(o.label)+'</option>';
      });
      html+='</select>';
    } else if(f.type==='color') {
      html+='<div class="color-picker" data-picker="'+f.name+'">';
      f.options.forEach(function(c){
        html+='<div class="color-dot-btn '+(c===f.value?'selected':'')+'" data-val="'+c+'" style="background:'+c+'"></div>';
      });
      html+='<input type="hidden" id="field-'+f.name+'" value="'+(f.value||'')+'" /></div>';
    } else if(f.type==='icon') {
      html+='<div class="icon-picker" data-picker="'+f.name+'">';
      f.options.forEach(function(ic){
        html+='<div class="icon-btn '+(ic===f.value?'selected':'')+'" data-val="'+ic+'">'+ic+'</div>';
      });
      html+='<input type="hidden" id="field-'+f.name+'" value="'+(f.value||'')+'" /></div>';
    }
    html+='</div>';
  });
  html+='<div class="modal-actions"><button class="btn-cancel" onclick="closeModal()">取消</button>'+
    '<button class="btn-confirm" id="form-confirm" style="background:var(--accent);color:#fff">确定</button></div>';
  if(options&&options.deleteFn)
    html+='<button class="btn-delete-in-modal" id="form-delete">'+escapeHtml(options.deleteText||'删除')+'</button>';
  showModal('<h3>'+escapeHtml(title)+'</h3>'+html);
  document.querySelectorAll('[data-picker]').forEach(function(pk){
    var hidden=document.getElementById('field-'+pk.dataset.picker);
    pk.querySelectorAll('.color-dot-btn,.icon-btn').forEach(function(btn){
      btn.addEventListener('click',function(){
        pk.querySelectorAll('.color-dot-btn,.icon-btn').forEach(function(b){b.classList.remove('selected');});
        btn.classList.add('selected');
        if(hidden) hidden.value=btn.dataset.val;
      });
    });
  });
  document.getElementById('form-confirm').addEventListener('click',function(){
    var vals={};
    fields.forEach(function(f){ var el=document.getElementById('field-'+f.name); if(el) vals[f.name]=el.value; });
    closeModal();
    onConfirm(vals);
  });
  if(options&&options.deleteFn)
    document.getElementById('form-delete').addEventListener('click',function(){ closeModal(); options.deleteFn(); });
}

/* ===== CRUD: Steps ===== */
function editStep(pid,sid) {
  var p=getProject(pid);if(!p)return;
  var s=p.steps.find(function(x){return x.id===sid;});if(!s)return;
  showFormModal('编辑步骤',[
    {type:'text',name:'title',label:'步骤名称',value:s.title},
    {type:'select',name:'status',label:'状态',value:s.status,options:[{value:'todo',label:'未开始'},{value:'active',label:'进行中'},{value:'done',label:'已完成'}]},
    {type:'textarea',name:'blocker',label:'卡点说明(可选)',value:s.blocker||'',placeholder:'描述当前卡点'}
  ],function(v){
    if(!v.title||!v.title.trim()){showToast('请输入步骤名称');return;}
    s.title=v.title.trim();s.status=v.status||s.status;s.blocker=(v.blocker&&v.blocker.trim())?v.blocker.trim():null;
    if(s.status==='done') s.blocker=null;
    saveData();render();showToast('步骤已更新');
  },{deleteText:'删除此步骤',deleteFn:function(){deleteStep(pid,sid);}});
}
function deleteStep(pid,sid) {
  var p=getProject(pid);if(!p)return;
  var s=p.steps.find(function(x){return x.id===sid;});if(!s)return;
  var idx=p.steps.indexOf(s);var backup=clone(s);
  p.steps.splice(idx,1);saveData();render();
  showToast('已删除步骤',function(){p.steps.splice(idx,0,backup);saveData();render();});
}
